<style>
:root {

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171b; --panel: #1d2026; --ink: #e8e6e1; --muted: #9aa0a9; --line: #2e323a;
    --accent: #e0b25a; --sel: rgba(224,178,90,.16); --royal: #0c0d10; --neutral: #2a2d34; --dim: 0.14; --chip: #262a31;
  }
}
:root[data-theme="dark"] {
  --bg: #15171b; --panel: #1d2026; --ink: #e8e6e1; --muted: #9aa0a9; --line: #2e323a;
  --accent: #e0b25a; --sel: rgba(224,178,90,.16); --royal: #0c0d10; --neutral: #2a2d34; --dim: 0.14; --chip: #262a31;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 16px; max-width: 1280px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
h1 small { display: block; font-size: 13px; color: var(--muted); font-weight: 400; }
h2 { font-size: 18px; margin: 32px 0 12px; }
h3 { font-size: 15px; margin: 20px 0 6px; }
main { max-width: 1280px; margin: 0 auto; padding: 0 16px 48px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; color: var(--muted); padding: 6px 12px; font: inherit; cursor: pointer; }
.seg button.on { background: var(--ink); color: var(--bg); }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.layout > * { min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
svg.map { width: 100%; height: auto; display: block; border-radius: 8px; touch-action: manipulation; }
.region { stroke: var(--bg); stroke-width: 1.5; cursor: pointer; transition: opacity .15s; }
.region.dim { opacity: var(--dim); }
.region.target { fill-opacity: .28; stroke-dasharray: 6 4; stroke-width: 3; }
.region.transit { fill-opacity: .55; }
.region.current { stroke: var(--ink); stroke-width: 5; }
.region.dropped { fill: var(--neutral); stroke: var(--muted); stroke-dasharray: 3 3; stroke-width: 2; }
.lbl { pointer-events: none; text-anchor: middle; fill: #fff; font-weight: 700; paint-order: stroke; stroke: rgba(0,0,0,.45); stroke-width: 2.5px; }
.lbl.sub { font-weight: 500; }
.lbl.faint { fill: var(--muted); stroke: none; }
.alist { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.chip { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--chip); cursor: pointer; font: inherit; color: inherit; text-align: left; }
.chip.on { outline: 2px solid var(--accent); }
.sw { width: 14px; height: 14px; border-radius: 4px; flex: none; }
.chip .meta { color: var(--muted); font-size: 12px; margin-left: auto; }
.steps { list-style: none; padding: 0; margin: 8px 0 0; max-height: 520px; overflow: auto; }
.steps li.day { font-weight: 700; margin: 10px 0 4px; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
.steps li.step { padding: 5px 8px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; }
.steps li.step:hover { background: var(--chip); }
.steps li.step.on { background: var(--ink); color: var(--bg); }
.tag-take { color: #2f9e55; font-weight: 700; } .tag-drop { color: #c2463a; font-weight: 700; }
.steps li.on .tag-take, .steps li.on .tag-drop { color: inherit; }
.note { color: var(--muted); font-size: 13px; }
.nav { display: flex; gap: 6px; margin-top: 8px; }
.nav button, .btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg { width: 18px; height: 12px; border-radius: 3px; display: inline-block; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th { color: var(--muted); font-weight: 600; background: var(--panel); position: sticky; top: 0; }
th:first-child, td:first-child, th.l, td.l { text-align: left; }
tr:last-child td { border-bottom: 0; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--chip); }
tbody tr.sel td { background: var(--sel); }
tbody tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 9px; border-radius: 6px; font-size: 12px; max-width: 260px; z-index: 10; display: none; }
.prose { max-width: 820px; }
#hMethod, #method { max-width: 820px; margin-left: auto; margin-right: auto; }
.prose p, .prose li { color: var(--ink); }
code, .formula { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; background: var(--chip); padding: 1px 5px; border-radius: 4px; }
.formula { display: block; padding: 8px 12px; margin: 8px 0; white-space: pre-wrap; }
.bar { display: inline-block; height: 8px; background: var(--accent); border-radius: 4px; vertical-align: middle; }
footer { color: var(--muted); font-size: 12px; text-align: center; padding: 24px 16px; }
</style>

const METHOD = {
  ru: `
<h3>1. Какие альянсы</h3>
<p>Топ-{n} альянсов сервера 337 по мощи. Данные: открытые страницы альянсов на lastasylum.gg — по каждому участнику уровень святилища и активность за неделю. Прирост мощи за 7 дней — разница мощи игрока между двумя снимками, {growthFrom} и {asOf}; игроки, вступившие после первого снимка, в прирост не входят.</p>

<p>Неактивные игроки (активность 0 или не указана) и игроки ниже 15-го уровня святилища в расчёт не входят — это твинки и брошенные аккаунты, они искажают средние. Остальные игроки всех альянсов в расчёте образуют общий пул — ${'{pool}'} игроков.</p>

<ul>

</ul>
<p>Показатель альянса — средний перцентиль его игроков. Качество:</p>
<span class="formula">Качество = 0,30 × Уровень + 0,35 × Активность + 0,35 × Прирост</span>
<h3>4. Размер альянса</h3>
<p>Большой альянс удержит больше, но размер не должен перевешивать качество, поэтому он учитывается через квадратный корень из числа игроков в расчёте: √N.</p>
<h3>5. КвК</h3>
<p>Учитываются четыре КвК. За 10, 17 и 24 октября участие видно по провалу мощи альянса: берётся первая запись дня КвК и минимум за этот и следующий день. Обычный день даёт +2–3%, поэтому провал означает реальные потери в бою. Множитель за каждый такой КвК растёт плавно, без порога:</p>
<span class="formula">КвК-множитель = 1 + 0,1 × min(провал / 15%, 1)</span>
<p>Провал 15% и больше даёт полный бонус ×1,1. КвК 31 октября учтён по списку участников: участник получает ×1,1, остальные ×1,0. За четыре КвК максимум ×1,46.</p>
<h3>6. Вес</h3>
<span class="formula">Вес = Качество × √N × КвК-множитель (за все КвК)</span>
<p>Доля альянса — его вес, делённый на сумму весов всех альянсов в расчёте.</p>
<h3>7. Ценность города</h3>
<span class="formula">Ценность = база тира × множитель бонуса
база: T1 = 1, T2 = 2, T3 = 4, T4 = 7, T5 = 11, T6 = 16
бонус: трава ×1,3; строительство и исследования (T6) ×1,3; обучение 5% (T6) ×0,8; остальные ×1,0</span>
<p>Суммарная ценность всех 86 городов — ${'{total}'}.</p>
<h3>8. Распределение</h3>
<p>У каждого альянса не больше 4 городов. Какие именно — решает место альянса по весу: чем выше место, тем ближе к центру и старше тиры. Два жёстких условия:</p>
<ul>
<li>ценность городов альянса растёт как его вес в четвёртой степени — небольшой перевес в весе даёт заметно более сильный набор, а почти равные по весу альянсы получают почти равные наборы;</li>
<li>города одного альянса образуют один связный кусок, без разрывов.</li>
</ul>
<p>Подбор — имитация отжига (несколько независимых запусков, берётся лучший). Регионов больше, чем помещается по 4 на альянс, поэтому свободными остаются: {unclaimed}. Их могут занять альянсы вне списка.</p>

<p>Распределение рисуется с чистого листа. Для каждого альянса строится свой независимый маршрут по правилам игры:</p>
<ul>
<li>регион тира 1 можно взять без соседства, остальные — только рядом с уже своими;</li>
<li>одновременно не больше 6 городов, не больше 3 захватов в сутки;</li>
<li>от города можно отказаться (сброс); между двумя сбросами — не меньше часа, захватывать после сброса можно сразу.</li>
</ul>
<p>Если до цели не дотянуться через свои города, маршрут идёт через транзитные: город берут ради соседства и сразу сбрасывают. Перебираются все порядки захвата, выбирается маршрут с минимумом транзита. Транзитный город может быть чужой итоговой целью — его нужно взять до того, как туда придёт хозяин, или договориться.</p>
<h3>10. Ограничения</h3>
<ul>
<li>Снимок данных на одну дату; веса меняются вместе с составами.</li>
<li>Провал мощи на КвК не отличает «дрался» от «разбили» — засчитывается как участие.</li>
<li>Маршруты не согласованы между альянсами по времени.</li>
</ul>`,
  en: `
<h3>1. Alliances</h3>
<p>The top {n} alliances of server 337 by power. Data comes from the public alliance pages on lastasylum.gg: sanctuary level and weekly activity for every member. 7-day power growth is the change in a player’s power between two snapshots, {growthFrom} and {asOf}; players who joined after the first snapshot are left out of growth.</p>
<h3>2. Who counts</h3>
<p>Inactive players (activity 0 or missing) and players below sanctuary level 15 are left out: these are alts and abandoned accounts that skew the averages. Everyone else from all counted alliances forms one pool of ${'{pool}'} players.</p>
<h3>3. Roster quality: percentiles, not thresholds</h3>
<p>Absolute thresholds (“level above 23”, “growth above 5M”) are unfair to younger alliances. Instead every player is compared with the rest of the pool and gets a percentile from 0 to 1 (0.8 = stronger than 80% of the pool):</p>
<ul>
<li><b>Level</b> — sanctuary level percentile across the whole pool.</li>
<li><b>Activity</b> — activity percentile across the whole pool.</li>
<li><b>Growth</b> — 7-day power growth percentile <b>within the player’s level band</b> (15–19, 20–23, 24–27, 28–30). A level-20 player competes on growth with levels 20–23, not with level 30.</li>
</ul>
<p>An alliance’s score on each metric is the mean percentile of its players. Quality:</p>
<span class="formula">Quality = 0.30 × Level + 0.35 × Activity + 0.35 × Growth</span>
<h3>4. Alliance size</h3>
<p>A bigger alliance can hold more, but size should not outweigh quality, so it enters as the square root of counted players: √N.</p>
<h3>5. KvK</h3>
<p>Four KvKs count. For October 10, 17 and 24, participation shows as a dip in alliance power: the first record of the KvK day versus the minimum over that day and the next. A normal day adds 2–3%, so a dip means real combat losses. The multiplier for each of these grows smoothly, with no cut-off:</p>
<span class="formula">KvK multiplier = 1 + 0.1 × min(dip / 15%, 1)</span>
<p>A dip of 15% or more earns the full ×1.1. The October 31 KvK is counted by the list of participants: a participant gets ×1.1, everyone else ×1.0. Four KvKs give at most ×1.46.</p>
<h3>6. Weight</h3>
<span class="formula">Weight = Quality × √N × KvK multiplier (all KvKs)</span>
<p>An alliance’s share is its weight divided by the sum of all counted alliances’ weights.</p>
<h3>7. City value</h3>
<span class="formula">Value = tier base × bonus multiplier
base: T1 = 1, T2 = 2, T3 = 4, T4 = 7, T5 = 11, T6 = 16
bonus: herb ×1.3; construction and research (T6) ×1.3; training 5% (T6) ×0.8; others ×1.0</span>
<p>All 86 cities add up to a value of ${'{total}'}.</p>
<h3>8. Distribution</h3>
<p>Each alliance gets at most 4 cities. Which ones depends on its place by weight: the higher the place, the closer to the center and the higher the tiers. Two hard rules:</p>
<ul>
<li>the value of an alliance’s cities grows with its weight to the fourth power — a small lead in weight buys a noticeably stronger set, while alliances of almost equal weight get almost equal sets;</li>
<li>an alliance’s cities form one connected piece, with no gaps.</li>
</ul>
<p>The search uses simulated annealing (several independent runs, the best one wins). There are more regions than 4 per alliance, so these stay unclaimed: {unclaimed}. Alliances outside the list may take them.</p>
<h3>9. Capture plan</h3>
<p>The distribution starts from an empty map. Each alliance gets its own independent route under the game rules:</p>
<ul>
<li>a tier-1 region can be taken without a shared border, any other only next to your own;</li>
<li>at most 6 cities at a time and at most 3 captures per day;</li>
<li>a city can be dropped; keep at least an hour between two drops, capturing right after a drop is fine.</li>

<p>When a target can’t be reached through your own cities, the route goes through transit cities: taken only to reach a neighbor and dropped right away. All capture orders are tried and the one with the fewest transits wins. A transit city may be another alliance’s final target — take it before its owner arrives, or agree on it.</p>
<h3>10. Limitations</h3>
<ul>
<li>A single data snapshot; weights move as rosters change.</li>
<li>A KvK power dip can’t tell “fought” from “got crushed” — both count as participation.</li>

</ul>`,

const BONUS_KEY = { 'Дерево': 'wood', 'Зерно': 'grain', 'Трава': 'herb', 'Скорость сбора зерна': 'grainGather',
  'Скорость исследований': 'research', 'Скорость обучения': 'training', 'Скорость строительства': 'build' };

const params = new URLSearchParams(location.search);
let lang = params.get('lang') || ((navigator.language || '').toLowerCase().startsWith('ru') ? 'ru' : 'en');
if (!T[lang]) lang = 'en';
let variant = DATA.variants.includes(params.get('variant')) ? params.get('variant') : DATA.variants[0];
let selected = params.get('a');
let stepIdx = null; // null = final state

const R = Object.fromEntries(DATA.regions.map(r => [r.id, r]));
const ALL = DATA.alliances;
const color = Object.fromEntries(ALL.map((a, i) => [a.tag, PALETTE[i % PALETTE.length]]));
const t = () => T[lang];
const fmt = (x, d = 2) => x.toLocaleString(lang === 'ru' ? 'ru-RU' : 'en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const big = x => Math.abs(x) >= 1e9 ? fmt(x / 1e9, 2) + (lang === 'ru' ? ' млрд' : 'B') : fmt(x / 1e6, 1) + (lang === 'ru' ? ' млн' : 'M');
const rname = id => lang === 'ru' ? R[id].name : R[id].nameEn;
const V = () => DATA.alloc[variant];

function syncUrl() {
  const p = new URLSearchParams();
  p.set('lang', lang);
  if (DATA.variants.length > 1) p.set('variant', variant);
  if (selected) p.set('a', selected);
  history.replaceState(null, '', '?' + p.toString());
}

function owners() {
  const o = {};
  for (const [tag, x] of Object.entries(V().alliances)) for (const c of x.cities) o[c] = tag;
  return o;
}

function flatSteps(tag) {
  const out = [];
  V().alliances[tag].route.days.forEach((day, i) => day.forEach(([kind, id]) => out.push({ day: i + 1, kind, id })));
  return out;
}

function stateAt(tag, k) {
  const held = new Set(), dropped = new Set();
  const steps = flatSteps(tag);
  for (let i = 0; i <= k && i < steps.length; i++) {
    const s = steps[i];
    if (s.kind === 'take') { held.add(s.id); dropped.delete(s.id); } else { held.delete(s.id); dropped.add(s.id); }
  }
  return { held, dropped, cur: k >= 0 ? steps[k]?.id : null };
}

const svgNS = 'http://www.w3.org/2000/svg';
function el(name, attrs, parent) {
  const e = document.createElementNS(svgNS, name);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}

function drawMap() {
  const svg = document.getElementById('map');
  svg.innerHTML = '';
  const own = owners();
  const defs = el('defs', {}, svg);
  const gR = el('g', {}, svg), gL = el('g', {}, svg);
  let st = null, finals = null;
  if (selected) {
    finals = new Set(V().alliances[selected].cities);
    if (stepIdx !== null) st = stateAt(selected, stepIdx);
  }
  for (const r of DATA.regions) {
    const isRoyal = r.tier === null;
    const tag = own[r.id];
    const p = el('path', { d: r.d, class: 'region' }, gR);
    let fill = isRoyal ? 'var(--royal)' : tag ? color[tag] : 'var(--neutral)';
    if (selected) {
      if (st) {
        if (st.held.has(r.id)) {
          fill = color[selected];
          if (!finals.has(r.id)) {
            const id = 'h' + r.id;
            const pat = el('pattern', { id, width: 10, height: 10, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, defs);
            el('rect', { width: 10, height: 10, fill: color[selected], 'fill-opacity': .35 }, pat);
            el('rect', { width: 4, height: 10, fill: color[selected] }, pat);
            fill = `url(#${id})`;
          }
        } else if (st.dropped.has(r.id)) { p.classList.add('dropped'); fill = null; }
        else if (finals.has(r.id)) { p.classList.add('target'); fill = color[selected]; p.setAttribute('stroke', color[selected]); }
        else p.classList.add('dim');
        if (st.cur === r.id) p.classList.add('current');
      } else if (tag !== selected && !isRoyal) p.classList.add('dim');
    }
    if (fill) p.setAttribute('fill', fill);
    p.addEventListener('mousemove', e => showTip(e, r, tag));
    p.addEventListener('mouseleave', hideTip);
    p.addEventListener('click', () => { if (tag) select(tag === selected ? null : tag); });

    const fs = Math.max(9, Math.min(22, r.room * 0.42));
    const faint = (!tag && !isRoyal) || selected && !isRoyal && (st ? !(st.held.has(r.id) || finals.has(r.id) || st.dropped.has(r.id)) : tag !== selected);
    const top = isRoyal ? (lang === 'ru' ? 'Корол.' : 'Royal') : tag || '—';
    const a = el('text', { x: r.anchor[0], y: r.anchor[1] - fs * 0.1, class: 'lbl' + (faint ? ' faint' : ''), 'font-size': fs }, gL);
    a.textContent = top;
    if (!isRoyal) {
      const b = el('text', { x: r.anchor[0], y: r.anchor[1] + fs * 0.85, class: 'lbl sub' + (faint ? ' faint' : ''), 'font-size': fs * 0.75 }, gL);
      b.textContent = 'T' + r.tier;
    }
  }
  const lg = document.getElementById('legend');
  if (selected && st) {
    const c = color[selected];
    lg.innerHTML = `<span><i class="lg" style="background:${c}"></i>${t().lgHeld}</span>
      <span><i class="lg" style="background:${c};opacity:.3;border:2px dashed ${c}"></i>${t().lgTarget}</span>
      <span><i class="lg" style="background:repeating-linear-gradient(45deg,${c} 0 3px,transparent 3px 7px)"></i>${t().lgTransit}</span>
      <span><i class="lg" style="background:var(--neutral);border:1px dashed var(--muted)"></i>${t().lgDropped}</span>
      <span><i class="lg" style="border:3px solid var(--ink)"></i>${t().lgCur}</span>`;
  } else lg.innerHTML = `<span><i class="lg" style="background:var(--royal)"></i>${t().lgRoyal}</span>` +
    (DATA.unclaimed.length ? `<span><i class="lg" style="background:var(--neutral);border:1px solid var(--line)"></i>${t().lgFree}</span>` : '');
}

function showTip(e, r, tag) {
  const tip = document.getElementById('tip');
  const bonus = r.bonus ? `${t().bonus[BONUS_KEY[r.bonus.label]]} +${r.bonus.value}%` : '';
  tip.innerHTML = `<b>${rname(r.id)}</b>${r.tier ? ' · T' + r.tier : ''}<br>` +
    (tag ? `${t().tipOwner}: [${tag}]<br>` : r.tier ? `${t().lgFree}<br>` : '') + (bonus ? `${t().tipBonus}: ${bonus}<br>` : '') +
    (r.value ? `${t().tipValue}: ${fmt(r.value, 1)}` : '');
  tip.style.display = 'block';
  const x = Math.min(e.clientX + 14, innerWidth - 270);
  tip.style.left = x + 'px'; tip.style.top = (e.clientY + 14) + 'px';
}
function hideTip() { document.getElementById('tip').style.display = 'none'; }

function drawSide() {
  const side = document.getElementById('side');
  const rows = ALL.map((a, i) => {
    const x = V().alliances[a.tag];
    return `<button class="chip${a.tag === selected ? ' on' : ''}" data-tag="${a.tag}">
      <i class="sw" style="background:${color[a.tag]}"></i><b>${a.tag}</b><span class="meta">${i + 1} · ${x.cities.length}</span></button>`;
  }).join('');
  let html = `<div class="alist">${rows}</div>`;
  if (!selected) html += `<p class="note">${t().pick}</p>`;
  else {
    const a = ALL.find(a => a.tag === selected), x = V().alliances[selected], r = x.route;
    const finals = new Set(x.cities);
    html += `<h3><i class="sw" style="display:inline-block;vertical-align:-2px;background:${color[selected]}"></i> [${a.tag}] ${a.name}</h3>`;
    html += `<p class="note">${t().cities}: ${x.cities.map(c => `${rname(c)} (T${R[c].tier})`).join(', ')}</p>`;
    html += `<p class="note">${t().planNote(r.captures, r.transit, r.days.length)}</p>`;
    html += `<div class="nav"><button class="btn" id="bPrev">${t().prev}</button><button class="btn" id="bNext">${t().next}</button><button class="btn" id="bFinal">${t().reset}</button></div>`;
    html += '<ol class="steps">';
    let k = 0, drops = 0;
    r.days.forEach((day, i) => {
      html += `<li class="day">${t().day(i + 1)}</li>`;
      for (const [kind, id] of day) {
        const tr = kind === 'take' && !finals.has(id) ? ` · <i>${t().transit}</i>` : '';
        if (kind === 'drop') drops++;
        html += `<li class="step${stepIdx === k ? ' on' : ''}" data-k="${k}"><span class="tag-${kind}">${kind === 'take' ? t().take : t().drop}</span><span>${rname(id)} (T${R[id].tier})${tr}</span></li>`;
        k++;
      }
    });
    html += '</ol>';
    if (drops > 1) html += `<p class="note">${t().dropNote}</p>`;
  }
  side.innerHTML = html;
  side.querySelectorAll('.chip').forEach(b => b.onclick = () => select(b.dataset.tag === selected ? null : b.dataset.tag));
  side.querySelectorAll('.step').forEach(li => li.onclick = () => { stepIdx = +li.dataset.k; render(); });
  if (selected) {
    const n = flatSteps(selected).length;
    document.getElementById('bPrev').onclick = () => { stepIdx = stepIdx === null ? n - 1 : Math.max(-1, stepIdx - 1); render(); };
    document.getElementById('bNext').onclick = () => { stepIdx = stepIdx === null ? -1 : stepIdx + 1; if (stepIdx >= n) stepIdx = null; render(); };
    document.getElementById('bFinal').onclick = () => { stepIdx = null; render(); };
  }
}

function select(tag) { selected = tag; stepIdx = null; render(); }

function drawTables() {
  const c = t().cols;
  const res = document.getElementById('results');
  res.innerHTML = `<thead><tr><th>${c.rank}</th><th class="l">${c.tag}</th><th>${c.weight}</th><th>${c.share}</th><th>${c.count}</th><th class="l">${c.tiers}</th><th>${c.value}</th><th>${c.transit}</th><th>${c.days}</th></tr></thead><tbody>` +
    ALL.map((a, i) => {
      const x = V().alliances[a.tag];
      const tiers = x.cities.map(id => 'T' + R[id].tier).join(' ');
      return `<tr data-tag="${a.tag}"${a.tag === selected ? ' class="sel"' : ''}><td>${i + 1}</td><td class="l"><i class="sw" style="display:inline-block;vertical-align:-2px;background:${color[a.tag]}"></i> <b>${a.tag}</b> ${a.name}</td>
        <td>${fmt(a.weight)}</td><td>${fmt(a.share * 100, 1)}%</td><td>${x.cities.length}</td><td class="l">${tiers}</td>
        <td>${fmt(x.value, 1)}</td><td>${x.route.transit}</td><td>${x.route.days.length}</td></tr>`;
    }).join('') + '</tbody>';

  const d = document.getElementById('data');
  const pc = x => `<span class="bar" style="width:${Math.round(x * 40)}px"></span> ${fmt(x, 2)}`;
  d.innerHTML = `<thead><tr><th class="l">${c.tag}</th><th>${c.powerRank}</th><th>${c.power}</th><th>${c.members}</th><th>${c.inactive}</th><th>${c.low}</th><th>${c.eligible}</th>
    <th>${c.bands}</th><th>${c.mLevel}</th><th>${c.mAct}</th><th>${c.mGrowth}</th>
    <th>${c.pLevel}</th><th>${c.pAct}</th><th>${c.pGrowth}</th><th>${c.quality}</th><th>${c.size}</th>${ALL[0].kvks.map(k => `<th>${c.kvk(k.date)}</th>`).join('')}<th>${c.kvkx}</th><th>${c.weight}</th></tr></thead><tbody>` +
    ALL.map(a => `<tr data-tag="${a.tag}"${a.tag === selected ? ' class="sel"' : ''}><td class="l"><b>${a.tag}</b></td><td>${a.powerRank}</td><td>${big(a.power)}</td><td>${a.members}</td><td>${a.excludedInactive}</td><td>${a.excludedLowLevel}</td><td>${a.eligible}</td>
      <td>${a.levelBands.join(' / ')}</td><td>${a.medianLevel}</td><td>${a.medianActivity}</td><td>${big(a.medianGrowth)}</td>
      <td>${pc(a.pLevel)}</td><td>${pc(a.pAct)}</td><td>${pc(a.pGrowth)}</td><td><b>${fmt(a.quality, 3)}</b></td><td>${fmt(a.sizeFactor, 2)}</td>
      ${a.kvks.map(k => `<td>${'drop' in k ? '−' + fmt(k.drop * 100, 0) + '%' : k.attended ? '✓' : '—'}</td>`).join('')}<td>×${fmt(a.kvk, 3)}</td><td><b>${fmt(a.weight)}</b></td></tr>`).join('') + '</tbody>';
}

function render() {
  document.documentElement.lang = lang;
  document.title = lang === 'ru' ? 'Сервер 337: города' : 'Server 337 Cities';
  document.getElementById('title').innerHTML = `${t().title}<small>${t().sub(new Date(DATA.asOf * 1000).toLocaleDateString(lang === 'ru' ? 'ru-RU' : 'en-GB', { day: 'numeric', month: 'long', year: 'numeric' }))}</small>`;
  document.getElementById('intro').textContent = t().intro.replace('{n}', ALL.length);
  document.getElementById('hResults').textContent = t().hResults + (DATA.variants.length > 1 ? ' — ' + t().variant(variant) : '');
  document.getElementById('hData').textContent = t().hData;
  document.getElementById('hMethod').textContent = t().hMethod;
  const day = ts => new Date(ts * 1000).toLocaleDateString(lang === 'ru' ? 'ru-RU' : 'en-GB', { day: 'numeric', month: 'long' });
  let m = METHOD[lang].replace('{pool}', DATA.poolSize).replace('{n}', ALL.length)
    .replace('{growthFrom}', day(DATA.growthFrom)).replace('{asOf}', day(DATA.asOf)).replace('{total}', fmt(DATA.totalValue, 1))
    .replace('{unclaimed}', DATA.unclaimed.map(id => `${rname(id)} (T${R[id].tier})`).join(', '));
  const method = document.getElementById('method');
  method.innerHTML = m;
  method.querySelectorAll('[data-variant]').forEach(li => { if (!DATA.variants.includes(li.dataset.variant)) li.remove(); });
  document.getElementById('footer').textContent = t().footer;
  document.querySelectorAll('#langSeg button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  const vs = document.getElementById('variantSeg');
  vs.style.display = DATA.variants.length > 1 ? '' : 'none';
  vs.innerHTML = DATA.variants.map(v => `<button data-v="${v}" class="${v === variant ? 'on' : ''}">${t().variant(v)}</button>`).join('');
  vs.querySelectorAll('button').forEach(b => b.onclick = () => { variant = b.dataset.v; stepIdx = null; render(); });
  drawMap(); drawSide(); drawTables(); syncUrl();
  document.querySelectorAll('tbody tr[data-tag]').forEach(tr => tr.onclick = () => select(tr.dataset.tag === selected ? null : tr.dataset.tag));
}

document.querySelectorAll('#langSeg button').forEach(b => b.onclick = () => { lang = b.dataset.lang; render(); });
if (selected && !color[selected]) selected = null;
render();
</script>
</body>
</html>
