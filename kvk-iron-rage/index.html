* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 16px; max-width: 1280px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }

.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.controls .lbl { color: var(--muted); font-size: 13px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 800px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
@media (max-width: 800px) { .tiles { grid-template-columns: minmax(0, 1fr); } }
.tile-head { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; margin-bottom: 10px; }
.sw { width: 12px; height: 12px; border-radius: 3px; flex: none; display: inline-block; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px 16px; }
.stat .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat .k { color: var(--muted); font-size: 12px; }
.stat .d { font-size: 12px; color: var(--muted); }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--muted); font: 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
svg text.ink { fill: var(--ink); }
svg text.b { font-weight: 600; }
.gl { stroke: var(--grid); stroke-width: 1; }
.ax { stroke: var(--line); stroke-width: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin: 4px 0 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.15); max-width: 280px; display: none; }
.tip b { display: block; margin-bottom: 2px; }
.tip .r { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); }
.tip .r span:last-child { color: var(--ink); font-variant-numeric: tabular-nums; }
.hit { fill: transparent; cursor: default; }
.mark { transition: opacity .12s; }
.dimmed .mark { opacity: .25; }
.dimmed .mark.hl { opacity: 1; }
.hit.click { cursor: pointer; }
.has-sel .pm { opacity: .18; }
.has-sel .pm.sel { opacity: 1; }
.has-sel text.sel { font-weight: 700; fill: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 3px 8px; border-radius: 6px; background: var(--chip); border: 1px solid var(--line); font-size: 13px; cursor: pointer; }
.chip.sel { outline: 2px solid var(--ink); outline-offset: -1px; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--hover); }
tbody tr.sel td { background: var(--hover); font-weight: 600; }
tbody tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--ink); }
input.search { font: inherit; font-size: 14px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); min-width: 0; width: 220px; }
.selbar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 9; display: none; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; background: var(--ink); color: var(--bg); border-radius: 999px; box-shadow: 0 6px 20px rgba(0,0,0,.25); font-size: 14px; max-width: calc(100% - 32px); }
.selbar.on { display: flex; }
.selbar .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.selbar .meta { opacity: .75; white-space: nowrap; }
.selbar button { border: 0; background: rgba(127,127,127,.35); color: inherit; border-radius: 999px; width: 26px; height: 26px; cursor: pointer; font: inherit; line-height: 1; flex: none; }
.chip i { font-style: normal; color: var(--muted); font-size: 12px; margin-left: 4px; }
.tbl-wrap { overflow: auto; max-height: 560px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th { color: var(--muted); font-weight: 500; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--panel); }
th.on { color: var(--ink); }
th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
td .st { display: inline-flex; align-items: center; gap: 5px; }
.note { color: var(--muted); font-size: 12px; margin-top: 8px; }

<script>
(function () {
  const ALLY = ['IRON', 'RAGE'];
  const AC = { IRON: 'var(--iron)', RAGE: 'var(--rage)' };
  const STATUS = [
    { k: 'fight', c: 'var(--st-fight)' },
    { k: 'unk', c: 'var(--st-unk)' },
    { k: 'hit', c: 'var(--st-hit)' },
    { k: 'shield', c: 'var(--st-shield)' },
    { k: 'none', c: 'var(--st-none)' },
  ];
  const ST = Object.fromEntries(STATUS.map(s => [s.k, s]));
  const KP_MIN = 10000, LOSS_MIN = 3e6;

  // ---------- i18n ----------
  const T = {
    ru: {
      title: 'KvK: IRON против RAGE',
      sub: 'Два КвК, 14.11 и 21.11.2026. Сравнение по боевой мощи (БМ) и kill points (КП) до и после боёв',
      kvkLbl: 'КвК', both: 'Оба', bothKvk: 'Оба КвК', kvk: 'КвК',
      theme: { auto: 'Авто', light: 'Светлая', dark: 'Тёмная' },
      cmpH: 'Сравнение альянсов',
      cmpLead: 'Эффективность = сколько КП игрок набил на каждый 1 млн потерянной БМ. Считается только по игрокам, у которых известны и прирост КП, и потери БМ, иначе цифры не сравнить.',
      effH: 'КП на 1 млн потерь БМ', kpH: 'Суммарный прирост КП, млн',
      partH: 'Кто воюет, а кто сидит под щитом',
      partLead: 'Статус игрока в каждом КвК. <b>Воевал</b>: прирост КП от 10 тыс. <b>Потери, КП не сняты</b>: БМ упала от 3 млн, а КП за день неизвестны, скорее всего дрался. <b>Потери без КП</b>: БМ упала от 3 млн, а КП почти не выросли, похоже на обнуление. <b>Под щитом</b>: БМ почти не упала и КП не росли. <b>Нет данных</b>: БМ не снята.',
      idleH: 'Не воевали ни в одном КвК',
      idleNote: 'Сюда попали игроки, у которых ни в одном КвК нет статуса «Воевал» или «Потери, КП не сняты». В скобках статусы по двум дням.',
      idleNone: 'Таких нет',
      plH: 'Эффективность игроков', allyLbl: 'Альянс', all: 'Все', sortLbl: 'Сортировка',
      metric: { kp: 'Прирост КП', eff: 'КП на 1 млн', loss: 'Потери БМ' },
      scH: 'Потери БМ и прирост КП',
      scLead: 'Каждая точка — игрок в одном КвК. Чем выше и левее, тем эффективнее: много КП при малых потерях. Пунктир — средняя эффективность обоих альянсов.',
      tblH: 'Таблица',
      search: 'Найти игрока…', selHint: 'Кликните по точке, столбику, строке таблицы или нику в списке выше, чтобы подсветить игрока на всех графиках. Повторный клик снимает выбор.',
      clear: 'Снять выбор', selected: 'Выбран',
      st: { fight: 'Воевал', unk: 'Потери, КП не сняты', hit: 'Потери без КП', shield: 'Под щитом', none: 'Нет данных' },
      players: 'игроков в выгрузке', fought: 'воевали', foughtAny: 'воевали хотя бы раз', withUnk: 'с «КП не сняты»',
      effTile: 'КП на 1 млн потерь БМ', better: 'лучше', sample: n => `по ${n} записям с полными данными`,
      kpTotal: 'прирост КП, всего', lossTotal: 'потери БМ, всего',
      tipEff: 'КП на 1 млн потерь', tipKp: 'Прирост КП', tipLoss: 'Потери БМ', tipFought: 'Воевали', of: 'из', tipPlayers: 'Игроков',
      andMore: n => ` и ещё ${n}`, foughtCol: 'воевали',
      xAxis: 'Потери БМ, млн →', yAxis: '↑ Прирост КП, тыс.', avg: v => `в среднем ${v} КП на 1 млн`,
      barsT: { kp: 'Прирост КП по игрокам', eff: 'КП на 1 млн потерь БМ по игрокам', loss: 'Потери БМ по игрокам, млн' },
      sumBoth: 'сумма за оба КвК',
      missing: n => `Ещё ${n} игроков без значения: нет данных или ноль. `,
      effNote: 'Эффективность считается только там, где потери от 1 млн БМ, иначе цифры улетают в бесконечность.',
      status: 'Статус', col: { name: 'Игрок', ally: 'Альянс', bm: 'БМ', loss: 'Потери БМ', kp: 'Прирост КП', eff: 'КП на 1 млн' },
      mln: 'млн', k: 'тыс.', locale: 'ru-RU',
    },
    en: {
      title: 'KvK: IRON vs RAGE',
      sub: 'Two KvKs, Nov 14 and Nov 21, 2026. Power and kill points (KP) before and after the fights',
      kvkLbl: 'KvK', both: 'Both', bothKvk: 'Both KvKs', kvk: 'KvK',
      theme: { auto: 'Auto', light: 'Light', dark: 'Dark' },
      cmpH: 'Alliance comparison',
      cmpLead: 'Efficiency = KP gained per 1M of power lost. Only players with both KP gain and power loss known are counted, otherwise the numbers are not comparable.',
      effH: 'KP per 1M power lost', kpH: 'Total KP gained, M',
      partH: 'Who fights and who hides under a shield',
      partLead: 'Player status in each KvK. <b>Fought</b>: KP gain of 10k or more. <b>Losses, KP unknown</b>: power dropped by 3M+ but the day’s KP was not captured, most likely fought. <b>Losses without KP</b>: power dropped by 3M+ with almost no KP, looks like getting zeroed. <b>Shielded</b>: power barely dropped and KP did not grow. <b>No data</b>: power not captured.',
      idleH: 'Did not fight in either KvK',
      idleNote: 'Players with no “Fought” or “Losses, KP unknown” status in either KvK. Statuses for both days are shown next to the name.',
      idleNone: 'Nobody',
      plH: 'Player efficiency', allyLbl: 'Alliance', all: 'All', sortLbl: 'Sort by',
      metric: { kp: 'KP gained', eff: 'KP per 1M', loss: 'Power lost' },
      scH: 'Power lost vs KP gained',
      scLead: 'Each dot is a player in one KvK. Higher and further left means more efficient: lots of KP for little loss. The dashed line is the average efficiency of both alliances.',
      tblH: 'Table',
      search: 'Find a player…', selHint: 'Click a dot, a bar, a table row or a name in the lists above to highlight that player on every chart. Click again to clear.',
      clear: 'Clear selection', selected: 'Selected',
      st: { fight: 'Fought', unk: 'Losses, KP unknown', hit: 'Losses without KP', shield: 'Shielded', none: 'No data' },
      players: 'players in export', fought: 'fought', foughtAny: 'fought at least once', withUnk: 'incl. “KP unknown”',
      effTile: 'KP per 1M power lost', better: 'better', sample: n => `from ${n} complete records`,
      kpTotal: 'KP gained, total', lossTotal: 'power lost, total',
      tipEff: 'KP per 1M lost', tipKp: 'KP gained', tipLoss: 'Power lost', tipFought: 'Fought', of: 'of', tipPlayers: 'Players',
      andMore: n => ` and ${n} more`, foughtCol: 'fought',
      xAxis: 'Power lost, M →', yAxis: '↑ KP gained, k', avg: v => `average ${v} KP per 1M`,
      barsT: { kp: 'KP gained by player', eff: 'KP per 1M power lost by player', loss: 'Power lost by player, M' },
      sumBoth: 'total for both KvKs',
      missing: n => `${n} more players have no value: missing data or zero. `,
      effNote: 'Efficiency is shown only for losses of 1M power or more, otherwise the ratio shoots to infinity.',
      status: 'Status', col: { name: 'Player', ally: 'Alliance', bm: 'Power', loss: 'Power lost', kp: 'KP gained', eff: 'KP per 1M' },
      mln: 'M', k: 'k', locale: 'en-US',
    },
  };

  const params = new URLSearchParams(location.search);
  let saved = null; try { saved = localStorage.getItem('kvk-lang'); } catch (e) {}
  let lang = params.get('lang') || saved || ((navigator.language || '').toLowerCase().startsWith('ru') ? 'ru' : 'en');
  if (!T[lang]) lang = 'ru';
  const t = () => T[lang];

  // ---------- data ----------
  const text = document.getElementById('kvk-data').textContent; // trim() ниже срезает и BOM
  const num = v => (v === '' || v == null) ? null : Number(v);
  const rows = text.trim().split(/\r?\n/).slice(1).map(line => {
    const f = line.split(',');
    const r = {
      date: f[0], ally: f[1], name: f[2], id: f[3],
      bmBefore: num(f[4]), bmAfter: num(f[5]), loss: num(f[6]),
      kpBefore: num(f[7]), kpAfter: num(f[8]), kp: num(f[9]),
    };
    r.status = classify(r);
    r.eff = (r.kp != null && r.loss != null && r.loss >= 1e6) ? r.kp / (r.loss / 1e6) : null;
    return r;
  });
  function classify(r) {
    if (r.kp != null && r.kp >= KP_MIN) return 'fight';
    if (r.loss == null) return 'none';
    if (r.loss >= LOSS_MIN) return r.kp == null ? 'unk' : 'hit';
    return 'shield';
  }
  const DATES = [...new Set(rows.map(r => r.date))].sort();
  const dLabel = d => d.slice(8, 10) + '.' + d.slice(5, 7);

  const players = new Map();
  rows.forEach(r => {
    if (!players.has(r.id)) players.set(r.id, { id: r.id, name: r.name, ally: r.ally, by: {} });
    players.get(r.id).by[r.date] = r;
  });

  // ---------- state ----------
  let theme = 'auto'; try { theme = localStorage.getItem('kvk-theme') || 'auto'; } catch (e) {}
  const state = { kvk: 'all', ally: 'all', metric: 'kp', sortCol: 'kp', sortDir: -1, sel: null };
  if (params.get('player') && players.has(params.get('player'))) state.sel = params.get('player');
  const kvkDates = () => state.kvk === 'all' ? DATES : [state.kvk];

  // ---------- helpers ----------
  const loc = () => t().locale;
  const fmtM = v => v == null ? '—' : (v / 1e6).toLocaleString(loc(), { maximumFractionDigits: 1, minimumFractionDigits: 1 }) + ' ' + t().mln;
  const fmtK = v => v == null ? '—' : v >= 1e6 ? (v / 1e6).toLocaleString(loc(), { maximumFractionDigits: 2 }) + ' ' + t().mln : v >= 1e4 ? Math.round(v / 1e3).toLocaleString(loc()) + ' ' + t().k : Math.round(v).toLocaleString(loc());
  const fmtN = v => v == null ? '—' : Math.round(v).toLocaleString(loc());
  const fmtTick = v => v.toLocaleString(loc());
  const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const stName = k => t().st[k];
  const lcFirst = s => s.charAt(0).toLowerCase() + s.slice(1);
  const NS = 'http://www.w3.org/2000/svg';
  function niceMax(v) {
    if (v <= 0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p;
    return 10 * p;
  }
  function ticks(max, n = 4) { const s = []; for (let i = 0; i <= n; i++) s.push(max * i / n); return s; }
  const roundTop = (x, y, w, h, r = 4) => {
    if (h <= 0) return '';
    r = Math.min(r, h, w / 2);
    return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
  };
  const roundRight = (x, y, w, h, r = 4) => {
    if (w <= 0) return '';
    r = Math.min(r, w, h / 2);
    return `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x}Z`;
  };
  function legend(id, items) {
    document.getElementById(id).innerHTML = items.map(i => `<span><span class="sw" style="background:${i.c}"></span>${esc(i.n)}</span>`).join('');
  }
  const setText = (id, v) => { document.getElementById(id).textContent = v; };

  // tooltip
  const tip = document.getElementById('tip');
  function showTip(ev, html) {
    tip.innerHTML = html; tip.style.display = 'block';
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = ev.clientX + 14, y = ev.clientY + 14;
    if (x + w > innerWidth - 8) x = ev.clientX - w - 14;
    if (y + h > innerHeight - 8) y = ev.clientY - h - 14;
    tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
  }
  const hideTip = () => { tip.style.display = 'none'; };
  const trow = (k, v) => `<div class="r"><span>${k}</span><span>${v}</span></div>`;
  function bindTip(node, fn, onEnter, onLeave) {
    node.addEventListener('mousemove', ev => showTip(ev, fn()));
    node.addEventListener('mouseenter', () => onEnter && onEnter());
    node.addEventListener('mouseleave', () => { hideTip(); onLeave && onLeave(); });
  }
  function el(tag, attrs, parent) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }

  // ---------- aggregates ----------
  function allyStats(ally, dates) {
    const rs = rows.filter(r => r.ally === ally && dates.includes(r.date));
    const both = rs.filter(r => r.kp != null && r.loss != null);
    const kp = both.reduce((s, r) => s + r.kp, 0);
    const loss = both.reduce((s, r) => s + r.loss, 0);
    const kpAll = rs.reduce((s, r) => s + (r.kp || 0), 0);
    const lossAll = rs.reduce((s, r) => s + (r.loss || 0), 0);
    const cnt = Object.fromEntries(STATUS.map(s => [s.k, 0]));
    rs.forEach(r => cnt[r.status]++);
    const n = new Set(rs.map(r => r.id)).size;
    const ids = new Set(rs.filter(r => r.status === 'fight').map(r => r.id));
    const idsMaybe = new Set(rs.filter(r => r.status === 'fight' || r.status === 'unk').map(r => r.id));
    return { rows: rs, n, kp, loss, eff: loss ? kp / (loss / 1e6) : null, kpAll, lossAll, cnt, fought: ids.size, foughtMaybe: idsMaybe.size, sample: both.length };
  }

  // ---------- controls ----------
  function seg(id, opts, get, set) {
    const box = document.getElementById(id);
    box.innerHTML = '';
    opts.forEach(([v, label]) => {
      const b = document.createElement('button');
      b.textContent = label; b.className = get() === v ? 'on' : '';
      b.onclick = () => set(v);
      box.appendChild(b);
    });
  }
  function applyTheme() {
    if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    else delete document.documentElement.dataset.theme;
    try { if (theme === 'auto') localStorage.removeItem('kvk-theme'); else localStorage.setItem('kvk-theme', theme); } catch (e) {}
  }
  function syncUrl() {
    const u = new URL(location.href);
    u.searchParams.set('lang', lang);
    if (state.sel) u.searchParams.set('player', state.sel); else u.searchParams.delete('player');
    try { history.replaceState(null, '', u); } catch (e) {}
  }
  function renderControls() {
    seg('kvkSeg', [['all', t().both], ...DATES.map(d => [d, dLabel(d)])], () => state.kvk, v => { state.kvk = v; renderAll(); });
    seg('themeSeg', ['auto', 'light', 'dark'].map(v => [v, t().theme[v]]), () => theme, v => { theme = v; applyTheme(); renderControls(); });
    seg('allySeg', [['all', t().all], ['IRON', 'IRON'], ['RAGE', 'RAGE']], () => state.ally, v => { state.ally = v; renderControls(); renderPlayers(); });
    seg('metricSeg', ['kp', 'eff', 'loss'].map(v => [v, t().metric[v]]), () => state.metric, v => { state.metric = v; state.sortCol = v; state.sortDir = -1; renderControls(); renderPlayers(); });
    document.querySelectorAll('#langSeg button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  }
  document.querySelectorAll('#langSeg button').forEach(b => b.onclick = () => {
    lang = b.dataset.lang;
    try { localStorage.setItem('kvk-lang', lang); } catch (e) {}
    renderAll();
  });

  function renderStatic() {
    const x = t();
    document.documentElement.lang = lang;
    document.title = x.title.replace('KvK: ', 'KvK ');
    setText('tTitle', x.title); setText('tSub', x.sub); setText('tKvkLbl', x.kvkLbl);
    setText('tCmpH', x.cmpH); setText('tCmpLead', x.cmpLead); setText('tEffH', x.effH); setText('tKpH', x.kpH);
    setText('tPartH', x.partH); document.getElementById('tPartLead').innerHTML = x.partLead;
    setText('tIdleH1', x.idleH); setText('tIdleH2', x.idleH); setText('tIdleNote', x.idleNote);
    setText('tPlH', x.plH); setText('tAllyLbl', x.allyLbl); setText('tSortLbl', x.sortLbl);
    setText('tScH', x.scH); setText('tScLead', x.scLead); setText('tTblH', x.tblH);
    setText('tSelHint', x.selHint);
    const ps = document.getElementById('pSearch');
    ps.placeholder = x.search; ps.setAttribute('aria-label', x.search);
    document.getElementById('selClear').title = x.clear;
    document.getElementById('selClear').setAttribute('aria-label', x.clear);
    const allyLegend = ALLY.map(a => ({ n: a, c: AC[a] }));
    ['lgA1', 'lgA2', 'lgSc', 'lgBars'].forEach(id => legend(id, allyLegend));
    legend('lgSt', STATUS.map(s => ({ n: stName(s.k), c: s.c })));
  }

  // ---------- tiles ----------
  function renderTiles() {
    const x0 = t(), dates = kvkDates();
    const s = ALLY.map(a => allyStats(a, dates));
    document.getElementById('tiles').innerHTML = ALLY.map((a, i) => {
      const x = s[i], o = s[1 - i];
      const better = x.eff != null && o.eff != null && x.eff > o.eff;
      return `<div class="card">
        <div class="tile-head"><span class="sw" style="background:${AC[a]}"></span>${a}</div>
        <div class="stats">
          <div class="stat"><div class="v">${x.n}</div><div class="k">${x0.players}</div></div>
          <div class="stat"><div class="v">${x.fought} <span style="font-size:14px;color:var(--muted)">${pct(x.fought, x.n)}</span></div><div class="k">${dates.length > 1 ? x0.foughtAny : x0.fought}</div><div class="d">${x0.withUnk}: ${x.foughtMaybe} (${pct(x.foughtMaybe, x.n)})</div></div>
          <div class="stat"><div class="v">${fmtN(x.eff)}</div><div class="k">${x0.effTile}${better ? ' · ' + x0.better : ''}</div><div class="d">${x0.sample(x.sample)}</div></div>
          <div class="stat"><div class="v">${fmtM(x.kpAll)}</div><div class="k">${x0.kpTotal}</div></div>
          <div class="stat"><div class="v">${fmtM(x.lossAll)}</div><div class="k">${x0.lossTotal}</div></div>
        </div>
      </div>`;
    }).join('');
  }

  // ---------- grouped bars by KvK ----------
  function groupedBars(container, valueFn, fmt, unitDiv = 1) {
    const box = document.getElementById(container);
    box.innerHTML = '';
    const W = 520, H = 240, m = { l: 48, r: 8, t: 20, b: 28 };
    const groups = [...DATES.map(d => ({ k: d, label: t().kvk + ' ' + dLabel(d), dates: [d] })), { k: 'all', label: t().bothKvk, dates: DATES }];
    const data = groups.map(g => ({ ...g, v: ALLY.map(a => ({ a, s: allyStats(a, g.dates) })).map(x => ({ ...x, val: valueFn(x.s) })) }));
    const max = niceMax(Math.max(...data.flatMap(g => g.v.map(x => x.val || 0))) / unitDiv);
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img' }, box);
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const y = v => m.t + ih - v / unitDiv / max * ih;
    ticks(max).forEach(tk => {
      el('line', { x1: m.l, x2: W - m.r, y1: y(tk * unitDiv), y2: y(tk * unitDiv), class: tk === 0 ? 'ax' : 'gl' }, svg);
      el('text', { x: m.l - 6, y: y(tk * unitDiv) + 4, 'text-anchor': 'end' }, svg).textContent = fmtTick(tk);
    });
    const gw = iw / groups.length, bw = Math.min(44, gw * 0.3), gap = 2;
    data.forEach((g, gi) => {
      const cx = m.l + gw * gi + gw / 2;
      const active = state.kvk === g.k;
      el('text', { x: cx, y: H - 8, 'text-anchor': 'middle', class: active ? 'ink b' : '' }, svg).textContent = g.label;
      g.v.forEach((x, i) => {
        const bx = cx - bw - gap / 2 + i * (bw + gap);
        const val = x.val || 0;
        const by = y(val);
        el('path', { d: roundTop(bx, by, bw, m.t + ih - by), fill: AC[x.a], class: 'mark' }, svg);
        el('text', { x: bx + bw / 2, y: by - 5, 'text-anchor': 'middle', class: 'ink' }, svg).textContent = fmt(val);
        const hit = el('rect', { x: bx - 1, y: m.t, width: bw + 2, height: ih, class: 'hit' }, svg);
        bindTip(hit, () => `<b>${x.a} · ${g.label}</b>` +
          trow(t().tipEff, fmtN(x.s.eff)) +
          trow(t().tipKp, fmtM(x.s.kpAll)) +
          trow(t().tipLoss, fmtM(x.s.lossAll)) +
          trow(t().tipFought, `${x.s.fought} ${t().of} ${x.s.n}`));
      });
    });
  }

  // ---------- participation stacked bars ----------
  function renderParticipation() {
    const box = document.getElementById('chPart');
    box.innerHTML = '';
    const lines = [];
    ALLY.forEach(a => DATES.forEach(d => lines.push({ a, d, s: allyStats(a, [d]) })));
    const W = 900, rowH = 34, m = { l: 120, r: 60, t: 20, b: 24 };
    const H = m.t + lines.length * rowH + m.b;
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img' }, box);
    const iw = W - m.l - m.r;
    [0, 25, 50, 75, 100].forEach(p => {
      const x = m.l + iw * p / 100;
      el('line', { x1: x, x2: x, y1: m.t, y2: H - m.b, class: p === 0 ? 'ax' : 'gl' }, svg);
      el('text', { x, y: H - 6, 'text-anchor': 'middle' }, svg).textContent = p + '%';
    });
    let selSeg = null;
    lines.forEach((ln, i) => {
      const yy = m.t + i * rowH + 6, bh = rowH - 12;
      const dim = state.kvk !== 'all' && state.kvk !== ln.d;
      const g = el('g', { opacity: dim ? 0.35 : 1 }, svg);
      el('rect', { x: 4, y: yy + bh / 2 - 6, width: 12, height: 12, rx: 3, fill: AC[ln.a] }, g);
      el('text', { x: 22, y: yy + bh / 2 + 4, class: 'ink' }, g).textContent = `${ln.a} · ${dLabel(ln.d)}`;
      const total = ln.s.rows.length;
      let x0 = m.l;
      STATUS.forEach(st => {
        const c = ln.s.cnt[st.k];
        if (!c) return;
        const w = iw * c / total;
        el('rect', { x: x0, y: yy, width: Math.max(0, w - 2), height: bh, fill: st.c, rx: 2, class: 'mark' }, g);
        if (w > 26) {
          const tx = el('text', { x: x0 + w / 2 - 1, y: yy + bh / 2 + 4, 'text-anchor': 'middle', class: 'ink b' }, g);
          tx.textContent = c;
          tx.setAttribute('style', 'fill:' + (st.k === 'none' || st.k === 'unk' ? 'var(--ink)' : '#fff'));
        }
        const hit = el('rect', { x: x0, y: yy - 4, width: w, height: bh + 8, class: 'hit' }, g);
        const names = ln.s.rows.filter(r => r.status === st.k).map(r => r.name);
        bindTip(hit, () => `<b>${ln.a} · ${dLabel(ln.d)} · ${stName(st.k)}</b>` + trow(t().tipPlayers, `${c} ${t().of} ${total} (${pct(c, total)})`) +
          `<div style="margin-top:4px;color:var(--muted);font-size:12px">${names.slice(0, 18).map(esc).join(', ')}${names.length > 18 ? t().andMore(names.length - 18) : ''}</div>`);
        const sp = state.sel && players.get(state.sel);
        if (sp && sp.ally === ln.a && sp.by[ln.d] && sp.by[ln.d].status === st.k) selSeg = { x: x0, w, yy, bh };
        x0 += w;
      });
      if (selSeg) {
        el('rect', { x: selSeg.x - 1.5, y: selSeg.yy - 3, width: Math.max(4, selSeg.w + 1), height: selSeg.bh + 6, rx: 4, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 2.5, 'pointer-events': 'none' }, g);
        el('path', { d: `M${selSeg.x + selSeg.w / 2 - 5},${selSeg.yy - 9}h10l-5,6z`, fill: 'var(--ink)', 'pointer-events': 'none' }, g);
        selSeg = null;
      }
      el('text', { x: W - m.r + 8, y: yy + bh / 2 + 4, class: 'ink b' }, g).textContent = pct(ln.s.cnt.fight, total);
    });
    el('text', { x: W - m.r + 8, y: 12 }, svg).textContent = t().foughtCol;

    ALLY.forEach(a => {
      const idle = [...players.values()].filter(p => p.ally === a && DATES.every(d => !p.by[d] || !['fight', 'unk'].includes(p.by[d].status)));
      setText('idleN' + a, idle.length);
      document.getElementById('idle' + a).innerHTML = idle.length
        ? idle.map(p => `<span class="chip${p.id === state.sel ? ' sel' : ''}" data-id="${p.id}" role="button" tabindex="0">${esc(p.name)}<i>${DATES.map(d => p.by[d] ? lcFirst(stName(p.by[d].status)) : '—').join(' / ')}</i></span>`).join('')
        : `<span class="note">${t().idleNone}</span>`;
      document.querySelectorAll('#idle' + a + ' .chip').forEach(ch => {
        ch.onclick = () => select(ch.dataset.id);
        ch.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(ch.dataset.id); } };
      });
    });
  }

  // ---------- players ----------
  function playerAgg(p, dates) {
    const rs = dates.map(d => p.by[d]).filter(Boolean);
    const kpRs = rs.filter(r => r.kp != null);
    const lossRs = rs.filter(r => r.loss != null);
    const both = rs.filter(r => r.kp != null && r.loss != null);
    const bk = both.reduce((s, r) => s + r.kp, 0), bl = both.reduce((s, r) => s + r.loss, 0);
    return {
      p, rs,
      kp: kpRs.length ? kpRs.reduce((s, r) => s + r.kp, 0) : null,
      loss: lossRs.length ? lossRs.reduce((s, r) => s + r.loss, 0) : null,
      eff: bl >= 1e6 ? bk / (bl / 1e6) : null,
      bm: rs.map(r => r.bmBefore).filter(v => v != null).pop() ?? null,
    };
  }
  function visiblePlayers() {
    return [...players.values()].filter(p => state.ally === 'all' || p.ally === state.ally).map(p => playerAgg(p, kvkDates()));
  }

  function renderScatter() {
    const box = document.getElementById('chScatter');
    box.innerHTML = '';
    const dates = kvkDates();
    const pts = rows.filter(r => dates.includes(r.date) && (state.ally === 'all' || r.ally === state.ally) && r.kp != null && r.loss != null);
    const W = 900, H = 380, m = { l: 56, r: 16, t: 12, b: 40 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const xMax = niceMax(Math.max(...pts.map(r => r.loss), 1) / 1e6);
    const yMax = niceMax(Math.max(...pts.map(r => r.kp), 1) / 1e3);
    const sx = v => m.l + v / 1e6 / xMax * iw, sy = v => m.t + ih - v / 1e3 / yMax * ih;
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img' }, box);
    ticks(yMax).forEach(tk => {
      el('line', { x1: m.l, x2: W - m.r, y1: sy(tk * 1e3), y2: sy(tk * 1e3), class: tk === 0 ? 'ax' : 'gl' }, svg);
      el('text', { x: m.l - 6, y: sy(tk * 1e3) + 4, 'text-anchor': 'end' }, svg).textContent = fmtTick(tk);
    });
    ticks(xMax, 4).forEach(tk => {
      el('line', { x1: sx(tk * 1e6), x2: sx(tk * 1e6), y1: m.t, y2: m.t + ih, class: tk === 0 ? 'ax' : 'gl' }, svg);
      el('text', { x: sx(tk * 1e6), y: m.t + ih + 16, 'text-anchor': 'middle' }, svg).textContent = fmtTick(tk);
    });
    el('text', { x: m.l + iw, y: H - 4, 'text-anchor': 'end' }, svg).textContent = t().xAxis;
    el('text', { x: m.l + 4, y: m.t + 10 }, svg).textContent = t().yAxis;
    const tk = pts.reduce((s, r) => s + r.kp, 0), tl = pts.reduce((s, r) => s + r.loss, 0);
    if (tl > 0) {
      const e = tk / tl;
      let x2 = xMax * 1e6, y2 = e * x2;
      if (y2 > yMax * 1e3) { y2 = yMax * 1e3; x2 = y2 / e; }
      el('line', { x1: sx(0), y1: sy(0), x2: sx(x2), y2: sy(y2), stroke: 'var(--muted)', 'stroke-dasharray': '4 4', 'stroke-width': 1.5 }, svg);
      el('text', { x: sx(x2) - 4, y: sy(y2) + 18, 'text-anchor': 'end' }, svg).textContent = t().avg(fmtN(e * 1e6));
    }
    if (state.sel) svg.classList.add('has-sel');
    const g = el('g', {}, svg);
    // выбранного рисуем последним, чтобы был поверх остальных
    pts.sort((a, b) => (a.id === state.sel) - (b.id === state.sel) || b.kp - a.kp).forEach(r => {
      const isSel = r.id === state.sel;
      el('circle', { cx: sx(r.loss), cy: sy(r.kp), r: isSel ? 7 : 5, fill: AC[r.ally], stroke: isSel ? 'var(--ink)' : 'var(--panel)', 'stroke-width': isSel ? 2.5 : 2, class: 'mark pm' + (isSel ? ' sel' : ''), 'data-id': r.id }, g);
      const hit = el('circle', { cx: sx(r.loss), cy: sy(r.kp), r: 10, class: 'hit click' }, g);
      hit.addEventListener('click', () => select(r.id));
      bindTip(hit, () => `<b>${esc(r.name)} · ${r.ally}</b>` + trow(t().kvk, dLabel(r.date)) + trow(t().tipKp, fmtK(r.kp)) + trow(t().tipLoss, fmtM(r.loss)) + trow(t().metric.eff, fmtN(r.eff)),
        () => { svg.classList.add('dimmed'); g.querySelectorAll(`[data-id="${r.id}"]`).forEach(n => n.classList.add('hl')); },
        () => { svg.classList.remove('dimmed'); g.querySelectorAll('.hl').forEach(n => n.classList.remove('hl')); });
    });
    const placed = [];
    const selPts = pts.filter(r => r.id === state.sel);
    // при выборе подписываем только выбранного игрока, иначе — топ по КП
    const toLabel = state.sel ? selPts : [...pts].sort((a, b) => b.kp - a.kp).slice(0, 8);
    toLabel.forEach(r => {
      const isSel = r.id === state.sel;
      const x = sx(r.loss), y = sy(r.kp), right = x > W - 160;
      const label = state.kvk === 'all' ? `${r.name} · ${dLabel(r.date)}` : r.name;
      const lx = x + (right ? -11 : 11), w = label.length * 7;
      const bx = { x0: right ? lx - w : lx, x1: right ? lx : lx + w, y0: y - 10, y1: y + 6 };
      if (!isSel && placed.some(b => b.x0 < bx.x1 && bx.x0 < b.x1 && b.y0 < bx.y1 && bx.y0 < b.y1)) return;
      if (!isSel && placed.length >= 6) return;
      placed.push(bx);
      el('text', { x: lx, y: y + 4, 'text-anchor': right ? 'end' : 'start', class: 'ink' + (isSel ? ' sel b' : '') }, svg).textContent = label;
    });
  }

  function renderBars() {
    const box = document.getElementById('chBars');
    box.innerHTML = '';
    const metric = state.metric;
    setText('barsTitle', t().barsT[metric] + ' · ' + (state.kvk === 'all' ? t().sumBoth : t().kvk + ' ' + dLabel(state.kvk)));
    const all = visiblePlayers();
    const list = all.filter(x => x[metric] != null && x[metric] > 0).sort((a, b) => b[metric] - a[metric]);
    const missing = all.length - list.length;
    setText('barsNote', (missing ? t().missing(missing) : '') + (metric === 'eff' ? t().effNote : ''));
    const W = 900, rowH = 20, m = { l: 160, r: 90, t: 22, b: 6 };
    const H = m.t + list.length * rowH + m.b;
    const iw = W - m.l - m.r;
    const div = metric === 'loss' ? 1e6 : 1;
    const max = niceMax(Math.max(...list.map(x => x[metric]), 1) / div);
    const svg = el('svg', { viewBox: `0 0 ${W} ${Math.max(H, 60)}`, role: 'img' }, box);
    if (state.sel && list.some(x => x.p.id === state.sel)) svg.classList.add('has-sel');
    ticks(max).forEach(tk => {
      const x = m.l + tk / max * iw;
      el('line', { x1: x, x2: x, y1: m.t - 4, y2: H - m.b, class: tk === 0 ? 'ax' : 'gl' }, svg);
      el('text', { x, y: 12, 'text-anchor': 'middle' }, svg).textContent = metric === 'kp' ? fmtK(tk) : fmtTick(tk);
    });
    const fmt = metric === 'kp' ? fmtK : metric === 'loss' ? fmtM : fmtN;
    list.forEach((x, i) => {
      const yy = m.t + i * rowH;
      const w = x[metric] / div / max * iw;
      const nm = x.p.name.length > 20 ? x.p.name.slice(0, 19) + '…' : x.p.name;
      const isSel = x.p.id === state.sel;
      if (isSel) el('rect', { x: 0, y: yy, width: W, height: rowH, rx: 4, fill: 'var(--hover)' }, svg);
      el('text', { x: m.l - 8, y: yy + rowH / 2 + 4, 'text-anchor': 'end', class: 'ink' + (isSel ? ' sel b' : '') }, svg).textContent = nm;
      el('path', { d: roundRight(m.l, yy + 3, w, rowH - 6), fill: AC[x.p.ally], class: 'mark pm' + (isSel ? ' sel' : ''), 'data-row': x.p.id }, svg);
      el('text', { x: m.l + w + 6, y: yy + rowH / 2 + 4, class: isSel ? 'sel' : '' }, svg).textContent = fmt(x[metric]);
      const hit = el('rect', { x: 0, y: yy, width: W, height: rowH, class: 'hit click' }, svg);
      hit.addEventListener('click', () => select(x.p.id));
      bindTip(hit, () => `<b>${esc(x.p.name)} · ${x.p.ally}</b>` + trow(t().tipKp, fmtK(x.kp)) + trow(t().tipLoss, fmtM(x.loss)) + trow(t().metric.eff, fmtN(x.eff)) +
        DATES.map(d => trow(t().status + ' ' + dLabel(d), x.p.by[d] ? stName(x.p.by[d].status) : '—')).join(''));
    });
  }

  function renderTable() {
    const c = t().col;
    const cols = [
      { k: 'name', n: c.name, v: x => x.p.name, f: x => esc(x.p.name) },
      { k: 'ally', n: c.ally, v: x => x.p.ally, f: x => `<span class="st"><span class="sw" style="background:${AC[x.p.ally]}"></span>${x.p.ally}</span>` },
      { k: 'bm', n: c.bm, v: x => x.bm, f: x => fmtM(x.bm) },
      { k: 'loss', n: c.loss, v: x => x.loss, f: x => fmtM(x.loss) },
      { k: 'kp', n: c.kp, v: x => x.kp, f: x => fmtN(x.kp) },
      { k: 'eff', n: c.eff, v: x => x.eff, f: x => fmtN(x.eff) },
      ...DATES.map(d => ({ k: 's' + d, n: t().status + ' ' + dLabel(d), v: x => x.p.by[d] ? STATUS.findIndex(s => s.k === x.p.by[d].status) : 9,
        f: x => x.p.by[d] ? `<span class="st"><span class="sw" style="background:${ST[x.p.by[d].status].c}"></span>${stName(x.p.by[d].status)}</span>` : '—' })),
    ];
    const list = visiblePlayers();
    const col = cols.find(cc => cc.k === state.sortCol) || cols[4];
    list.sort((a, b) => {
      const va = col.v(a), vb = col.v(b);
      if (va == null && vb == null) return 0;
      if (va == null) return 1; if (vb == null) return -1;
      return (typeof va === 'string' ? va.localeCompare(vb) : va - vb) * state.sortDir;
    });
    const tb = document.getElementById('tbl');
    tb.innerHTML = '<thead><tr>' + cols.map(cc => `<th data-k="${cc.k}" class="${cc.k === col.k ? 'on' : ''}">${cc.n}${cc.k === col.k ? (state.sortDir < 0 ? ' ↓' : ' ↑') : ''}</th>`).join('') + '</tr></thead><tbody>' +
      list.map(x => `<tr data-id="${x.p.id}"${x.p.id === state.sel ? ' class="sel"' : ''}>` + cols.map(cc => `<td>${cc.f(x)}</td>`).join('') + '</tr>').join('') + '</tbody>';
    tb.querySelectorAll('tbody tr').forEach(tr => tr.onclick = () => select(tr.dataset.id));
    tb.querySelectorAll('th').forEach(th => th.onclick = () => {
      const k = th.dataset.k;
      if (state.sortCol === k) state.sortDir *= -1; else { state.sortCol = k; state.sortDir = (k === 'name' || k === 'ally' || k.startsWith('s')) ? 1 : -1; }
      renderTable();
    });
  }

  function renderPlayers() { renderScatter(); renderBars(); renderTable(); }

  // ---------- выбор игрока ----------
  function renderSelbar() {
    const bar = document.getElementById('selbar');
    const p = state.sel && players.get(state.sel);
    bar.classList.toggle('on', !!p);
    if (!p) return;
    document.getElementById('selSw').style.background = AC[p.ally];
    setText('selName', p.name);
    const a = playerAgg(p, kvkDates());
    setText('selMeta', `${p.ally} · ${t().tipKp}: ${fmtK(a.kp)} · ${t().metric.eff}: ${fmtN(a.eff)}`);
  }
  function fillSearch() {
    document.getElementById('pList').innerHTML = [...players.values()]
      .sort((a, b) => a.name.localeCompare(b.name))
      .map(p => `<option value="${esc(p.name)} · ${p.ally}"></option>`).join('');
  }
  // скроллим только внутри таблицы, страницу не дёргаем
  function scrollTableToSel() {
    const tr = state.sel && document.querySelector(`#tbl tr[data-id="${state.sel}"]`);
    if (!tr) return;
    const wrap = tr.closest('.tbl-wrap');
    const head = wrap.querySelector('thead').offsetHeight;
    const top = tr.offsetTop - head, bottom = tr.offsetTop + tr.offsetHeight;
    if (top < wrap.scrollTop || bottom > wrap.scrollTop + wrap.clientHeight) wrap.scrollTop = top - wrap.clientHeight / 3;
  }
  function select(id, force) {
    state.sel = (!force && state.sel === id) ? null : id;
    const p = state.sel && players.get(state.sel);
    // если игрок скрыт фильтром альянса — показываем всех
    if (p && state.ally !== 'all' && state.ally !== p.ally) { state.ally = 'all'; renderControls(); }
    hideTip();
    renderParticipation();
    renderPlayers();
    renderSelbar();
    scrollTableToSel();
    syncUrl();
  }
  document.getElementById('selClear').onclick = () => select(null, true);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.sel) select(null, true); });
  const pSearch = document.getElementById('pSearch');
  pSearch.addEventListener('change', () => {
    const v = pSearch.value.trim().toLowerCase();
    if (!v) return;
    const all = [...players.values()];
    const p = all.find(q => `${q.name} · ${q.ally}`.toLowerCase() === v) || all.find(q => q.name.toLowerCase() === v)
      || all.find(q => q.name.toLowerCase().includes(v.replace(/ · (iron|rage)$/, '')));
    if (p) { select(p.id, true); pSearch.value = ''; pSearch.blur(); }
  });
  function renderAll() {
    renderStatic();
    renderControls();
    renderTiles();
    groupedBars('chEff', s => s.eff, v => fmtN(v));
    groupedBars('chKp', s => s.kpAll, v => (v / 1e6).toLocaleString(loc(), { maximumFractionDigits: 1 }), 1e6);
    renderParticipation();
    renderPlayers();
    renderSelbar();
    syncUrl();
  }
  fillSearch();
  applyTheme();
  renderAll();
})();
</script>
</body>
</html>
